# Hub + lobby behind Caddy (automatic HTTPS). Fill in deploy/.env first (copy .env.example), then:  docker compose up -d --build
# Only Caddy is exposed to the internet; the hub and lobby are reachable only through it.
services:
  hub:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      PLUNGE_HUB_ADMIN: ${PLUNGE_HUB_ADMIN:?set a long random value in deploy/.env}
    volumes: [ "hub-data:/data" ]
    read_only: true
    tmpfs: [ "/tmp" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 512m
    cpus: 1.0
    expose: [ "8788" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8788/health', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3

  lobby:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    command: [ "python", "app.py", "lobby", "--bind", "0.0.0.0", "--port", "8787" ]
    read_only: true
    tmpfs: [ "/tmp" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 256m
    cpus: 0.5
    expose: [ "8787" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/health', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?set HUB_DOMAIN in deploy/.env}
      LOBBY_DOMAIN: ${LOBBY_DOMAIN:?set LOBBY_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [ hub, lobby ]

volumes:
  hub-data:
  caddy-data:
  caddy-config:
